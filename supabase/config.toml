# Configuração mínima para publicar as Edge Functions com a CLI da Supabase
# (SPEC §16.13). Não contém chaves nem segredos.
# As duas funções não verificam o JWT da Supabase: o Tally e o pg_net não têm
# sessão. A protecção está na assinatura do Tally e no CRON_SECRET.

project_id = "mp-rcp"

[functions.tally-webhook]
verify_jwt = false
entrypoint = "./functions/tally-webhook/index.js"

[functions.associados-diario]
verify_jwt = false
entrypoint = "./functions/associados-diario/index.js"
